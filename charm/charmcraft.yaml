# Kubernetes charm for the IS SRE Standup Dashboard, built with the FastAPI
# 12-factor framework extension. Pack with `charmcraft pack` from this directory;
# the app runs from the rock image supplied as the app-image resource. See
# ../CHARM.md for the full build/deploy/integrate sequence.
name: standup-dashboard

type: charm

base: ubuntu@24.04

platforms:
  amd64:

summary: IS SRE Standup Dashboard — read-only Jira + PagerDuty + GitHub stand-up view.

description: |
  Single-user, read-only Jira + PagerDuty + GitHub + calendar stand-up dashboard.
  State lives in PostgreSQL (relation); raw fetch payloads are JSONB; a singleton
  scheduler service refreshes the data; Traefik provides ingress.

extensions:
  - fastapi-framework

# PostgreSQL is mandatory: the app stores everything there and migrate.sh fails
# fast without it. Integrate with `juju integrate standup-dashboard postgresql-k8s`.
# The relation injects POSTGRESQL_DB_CONNECT_STRING.
requires:
  postgresql:
    interface: postgresql_client
    optional: false
    limit: 1

config:
  options:
    # Each option <name> reaches the app as the env var APP_<NAME> (uppercase,
    # dashes -> underscores), read by config.py via _env().
    window-days:
      type: int
      default: 7
      description: How far back (days) a full refresh collects activity.
    refresh-interval:
      type: int
      default: 1800
      description: Seconds between scheduled refreshes (the -scheduler service).
    github-org:
      type: string
      default: canonical
      description: GitHub org for the "GH PRs" card line (empty disables it).
    github-concurrency:
      type: int
      default: 2
      description: Concurrency for the rate-limited GitHub Search API fetch.
    pd-team-ids:
      type: string
      default: PQ4ZG3S
      description: Comma-separated PagerDuty team IDs to scope incidents.
    pd-subdomain:
      type: string
      default: canonical
      description: PagerDuty web subdomain (for deep links).
    calendar:
      type: string
      default: "1"
      description: Set to "0" to disable per-engineer calendar free/busy fetches.
    raw-snapshot-full:
      type: boolean
      default: false
      description: >
        Store raw Jira snapshots verbatim. Default false trims the avatar-URL /
        self-link noise from changelog authors (~60% smaller, never read back)
        while keeping the changelog re-derivable. Set true to revert to
        full-fidelity payloads — at the cost of much faster JSONB growth.
    jira-base-url:
      type: string
      default: https://warthogs.atlassian.net
      description: Jira Cloud base URL.
    jira-account-email:
      type: string
      default: fernando.carrillo.castro@canonical.com
      description: Account email used for Jira Basic auth (with the API token).
    http-proxy:
      type: string
      default: ""
      description: Outbound HTTP proxy URL (APP_HTTP_PROXY -> HTTP_PROXY).
    https-proxy:
      type: string
      default: ""
      description: Outbound HTTPS proxy URL (APP_HTTPS_PROXY -> HTTPS_PROXY).
    no-proxy:
      type: string
      default: ""
      description: Comma-separated hosts/CIDRs to bypass the proxy (-> NO_PROXY).
    secrets:
      type: secret
      description: |
        A Juju user secret holding the API credentials. Create it with keys
        jira-token, pagerduty-token, pagerduty-ical-url, and (optionally)
        github-token; each surfaces to the app as APP_SECRETS_<KEY>.
